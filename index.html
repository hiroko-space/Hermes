<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080706">
  <title>Hermes｜観測の本棚</title>
  <meta name="description" content="世界を観測するためのピンを置く　Hermesは観測の軌跡を並べる本棚です">

  <meta property="og:title" content="Hermes｜観測の本棚">
  <meta property="og:description" content="世界を観測するためのピンを置く">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/hermes-room.webp">

  <style>
    :root {
      --bg:#080706;
      --cream:#efe1ca;
      --muted:#b8a990;
      --gold:#caa36d;
      --line:rgba(239,225,202,.18);
      --wood-a:#2d1b10;
      --wood-b:#714824;
    }

    * { box-sizing:border-box; }

    html {
      scroll-behavior:smooth;
      background:var(--bg);
    }

    body {
      margin:0;
      min-width:320px;
      color:var(--cream);
      background:var(--bg);
      font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
      letter-spacing:.035em;
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; }

    .hero {
      position:relative;
      overflow:hidden;
      min-height:58svh;
      background:#060708;
      border-bottom:1px solid var(--line);
    }

    .hero img {
      display:block;
      width:100%;
      height:auto;
      min-height:58svh;
      object-fit:cover;
      object-position:center top;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* 画像に描き込まれていた古いメニューを隠すための帯 */
    .hero-shade {
      position:absolute;
      inset:0 0 auto;
      z-index:2;
      height:15%;
      min-height:92px;
      background:
        linear-gradient(180deg,rgba(3,7,10,.98) 0%,rgba(3,7,10,.94) 72%,rgba(3,7,10,0) 100%);
      pointer-events:none;
    }

    .site-header {
      position:absolute;
      inset:0 0 auto;
      z-index:3;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:28px;
      padding:clamp(24px,3vw,42px) clamp(28px,5vw,78px);
    }

    .brand {
      display:flex;
      flex-direction:column;
      flex:0 0 auto;
      font-family:Georgia,"Times New Roman",serif;
      line-height:1;
    }

    .brand strong {
      font-size:clamp(24px,2.2vw,37px);
      font-weight:400;
      letter-spacing:.03em;
    }

    .brand small {
      margin-top:8px;
      color:#aa987e;
      font-size:9px;
      letter-spacing:.18em;
    }

    .main-nav {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:clamp(24px,3.2vw,52px);
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    }

    .nav-link {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
      min-width:max-content;
      color:#d9c9b0;
      font-size:clamp(13px,1.1vw,17px);
      line-height:1.2;
      transition:color .2s ease;
    }

    .nav-link small {
      color:#a99476;
      font:11px Georgia,"Times New Roman",serif;
      letter-spacing:.06em;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      color:#fff3df;
      outline:none;
    }

    .nav-pill {
      padding:11px 23px 12px;
      border:1px solid rgba(226,202,164,.64);
      border-radius:999px;
    }

    .hero-link {
      position:absolute;
      z-index:3;
      left:4.2%;
      top:66%;
      width:16%;
      height:9%;
      border-radius:999px;
      color:transparent;
      text-indent:-9999px;
    }

    .hero-link:focus-visible {
      outline:2px solid rgba(239,225,202,.7);
      outline-offset:4px;
    }

    .shelf-section {
      padding:clamp(58px,7vw,96px) 4vw clamp(76px,9vw,120px);
      background:
        radial-gradient(circle at 50% -10%,rgba(120,79,40,.15),transparent 38%),
        linear-gradient(180deg,#120e0b 0%,#080706 78%);
    }

    .section-head {
      max-width:1480px;
      margin:0 auto 36px;
    }

    .section-head h2 {
      margin:0;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(32px,4vw,58px);
      font-weight:400;
      letter-spacing:.06em;
      line-height:1.25;
    }

    .section-head h2 small {
      display:block;
      margin-bottom:9px;
      color:#a9977d;
      font:11px Georgia,"Times New Roman",serif;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    .bookshelf {
      position:relative;
      max-width:1480px;
      margin:0 auto;
      padding:44px 28px 58px;
      border:1px solid rgba(239,225,202,.12);
      background:
        linear-gradient(180deg,rgba(255,255,255,.025),transparent 27%),
        #110d0a;
      box-shadow:
        inset 0 0 82px rgba(0,0,0,.62),
        0 30px 75px rgba(0,0,0,.28);
      overflow:hidden;
    }

    .books {
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:clamp(8px,.8vw,14px);
      min-height:365px;
      overflow-x:auto;
      padding:0 12px 28px;
      scrollbar-color:#5e4025 #120d09;
    }

    .book {
      --c1:#282724;
      --c2:#121310;
      flex:0 0 clamp(72px,6.2vw,92px);
      height:var(--h,300px);
      padding:16px 11px 14px;
      border:0;
      border-radius:4px 4px 2px 2px;
      color:#eadfce;
      cursor:pointer;
      writing-mode:vertical-rl;
      background:
        linear-gradient(90deg,rgba(255,255,255,.075),transparent 15%,transparent 83%,rgba(0,0,0,.35)),
        linear-gradient(var(--c1),var(--c2));
      box-shadow:
        7px 8px 18px rgba(0,0,0,.43),
        inset 0 0 0 1px rgba(240,220,184,.13);
      transition:transform .24s ease,filter .24s ease;
    }

    .book:hover,
    .book:focus-visible {
      transform:translateY(-16px);
      filter:brightness(1.1);
      outline:none;
    }

    .book .vol {
      font:10px Georgia,"Times New Roman",serif;
      letter-spacing:.11em;
    }

    .book .title {
      margin:auto;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(17px,1.45vw,21px);
      letter-spacing:.08em;
    }

    .book .sub {
      color:#c3b49d;
      font-size:9px;
      letter-spacing:.08em;
    }

    .b0  { --c1:#d8cfbf; --c2:#aaa090; --h:304px; color:#2a241c; }
    .b0 .sub { color:#5f5548; }
    .b1  { --c1:#252725; --c2:#111412; --h:296px; }
    .b2  { --c1:#52251f; --c2:#25110e; --h:310px; }
    .b3  { --c1:#20373b; --c2:#0f2022; --h:288px; }
    .b4  { --c1:#39452e; --c2:#1b2317; --h:302px; }
    .b5  { --c1:#634327; --c2:#291a0f; --h:318px; }
    .b6  { --c1:#2e3d51; --c2:#151f2c; --h:294px; }
    .b7  { --c1:#3a3049; --c2:#1d1725; --h:314px; }
    .b8  { --c1:#65532b; --c2:#302510; --h:290px; }
    .b9  { --c1:#493d31; --c2:#231c16; --h:316px; }
    .b10 { --c1:#665a46; --c2:#30291f; --h:300px; }

    .shelf-plank {
      height:25px;
      margin-top:-20px;
      background:
        linear-gradient(180deg,rgba(255,255,255,.12),transparent 22%),
        linear-gradient(90deg,var(--wood-a),var(--wood-b) 30%,#3b2517 68%,#7a502a);
      box-shadow:0 14px 22px rgba(0,0,0,.56);
    }

    .closing {
      display:grid;
      grid-template-columns:.8fr 1.2fr;
      gap:38px;
      padding:clamp(72px,8vw,108px) 4vw;
      color:#201c17;
      background:#ece4d8;
    }

    .closing .label {
      color:#766b5d;
      font:11px Georgia,"Times New Roman",serif;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    .closing blockquote {
      margin:0;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(26px,3.3vw,50px);
      font-weight:400;
      line-height:1.65;
    }

    .closing footer {
      margin-top:31px;
      color:#786d60;
      font-size:13px;
    }

    .site-footer {
      display:flex;
      justify-content:space-between;
      gap:24px;
      padding:25px 4vw 36px;
      color:#776c5f;
      background:#ece4d8;
      border-top:1px solid rgba(45,36,27,.13);
      font-size:10px;
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    dialog {
      width:min(720px,calc(100vw - 28px));
      padding:0;
      border:1px solid rgba(225,203,165,.25);
      color:var(--cream);
      background:#0f0c0a;
      box-shadow:0 40px 120px rgba(0,0,0,.72);
    }

    dialog::backdrop {
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(6px);
    }

    .modal {
      position:relative;
      padding:clamp(36px,6vw,56px);
    }

    .modal small {
      display:block;
      color:#9f8f78;
      font:10px Georgia,"Times New Roman",serif;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .modal h3 {
      margin:18px 0 22px;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:clamp(33px,5vw,48px);
      font-weight:400;
      line-height:1.4;
    }

    .modal p {
      margin:0;
      color:#c6b7a1;
      font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      line-height:2;
    }

    .close {
      position:absolute;
      top:12px;
      right:16px;
      border:0;
      color:#ae9c82;
      background:transparent;
      cursor:pointer;
      font-size:28px;
    }

    @media (max-width:850px) {
      .hero img {
        min-height:65svh;
        object-position:57% top;
      }

      .hero-shade {
        height:170px;
      }

      .site-header {
        align-items:flex-start;
        padding:22px 20px;
      }

      .main-nav {
        gap:14px;
        flex-wrap:wrap;
      }

      .nav-link {
        font-size:12px;
      }

      .nav-link small {
        font-size:9px;
      }

      .nav-pill {
        padding:8px 14px 9px;
      }

      .hero-link {
        left:4%;
        top:67%;
        width:25%;
      }

      .closing {
        grid-template-columns:1fr;
      }

      .shelf-section {
        padding-left:18px;
        padding-right:18px;
      }

      .bookshelf {
        padding-left:9px;
        padding-right:9px;
      }

      .books {
        justify-content:flex-start;
      }

      .book {
        flex-basis:78px;
      }

      .closing {
        padding-left:22px;
        padding-right:22px;
      }

      .site-footer {
        flex-direction:column;
      }
    }

    @media (max-width:620px) {
      .site-header {
        position:relative;
        flex-direction:column;
        gap:18px;
        background:rgba(3,7,10,.98);
      }

      .hero-shade {
        display:none;
      }

      .main-nav {
        width:100%;
        justify-content:flex-start;
      }

      .hero img {
        margin-top:0;
        min-height:auto;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * { scroll-behavior:auto !important; }
      .book { transition:none; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <img
      src="assets/hermes-room.webp"
      alt="東京タワーを望む夜の書斎"
      width="1536"
      height="628"
      fetchpriority="high"
    >

    <div class="hero-shade" aria-hidden="true"></div>

    <div class="site-header">
      <a class="brand" href="index.html" aria-label="Hermes トップ">
        <strong>Hermes</strong>
        <small>OBSERVATORY OF PERCEPTION</small>
      </a>

      <nav class="main-nav" aria-label="主要メニュー">
        <a class="nav-link" href="#bookshelf">
          <span>本棚</span>
          <small>Bookshelf</small>
        </a>

        <a class="nav-link" href="books/about.html">
          <span>書き手について</span>
          <small>About</small>
        </a>

        <a class="nav-link nav-pill" href="books/vol00.html">
          <span>はじめての方へ</span>
        </a>
      </nav>
    </div>

    <a class="hero-link" href="#bookshelf">観測の本棚へ</a>
  </header>

  <main>
    <section class="shelf-section" id="bookshelf">
      <div class="section-head">
        <h2><small>The Shelf</small>観測の本棚</h2>
      </div>

      <div class="bookshelf">
        <div class="books">
          <a class="book b0" href="books/vol00.html">
            <span class="vol">Vol.00</span>
            <span class="title">はじまりの観測</span>
            <span class="sub">Hermesとは</span>
          </a>

          <button class="book b1" data-vol="Vol.01" data-title="身体" data-copy="感覚　状態　エネルギー　身体にピンを刺したとき世界はどのような輪郭を見せるのか">
            <span class="vol">Vol.01</span><span class="title">身体</span><span class="sub">感覚　状態　エネルギー</span>
          </button>

          <button class="book b2" data-vol="Vol.02" data-title="感情" data-copy="気分　感情　価値観　信念　内側に生まれた反応から何が見えてくるのか">
            <span class="vol">Vol.02</span><span class="title">感情</span><span class="sub">気分　価値観　信念</span>
          </button>

          <button class="book b3" data-vol="Vol.03" data-title="思考" data-copy="認知　判断　イメージ　パターン　思考の仕組みにピンを刺して観測する">
            <span class="vol">Vol.03</span><span class="title">思考</span><span class="sub">認知　判断　パターン</span>
          </button>

          <button class="book b4" data-vol="Vol.04" data-title="時間" data-copy="過去　現在　未来　タイミング　時間という位置から世界を観測する">
            <span class="vol">Vol.04</span><span class="title">時間</span><span class="sub">過去　現在　未来</span>
          </button>

          <button class="book b5" data-vol="Vol.05" data-title="記憶" data-copy="出来事　学び　繰り返されるパターン　記憶が現在につくる輪郭を観測する">
            <span class="vol">Vol.05</span><span class="title">記憶</span><span class="sub">出来事　学び　パターン</span>
          </button>

          <button class="book b6" data-vol="Vol.06" data-title="環境" data-copy="人　場所　自然　気圧　気温　匂い　外側の条件によって立ち上がる景色">
            <span class="vol">Vol.06</span><span class="title">環境</span><span class="sub">人　場所　自然　気圧</span>
          </button>

          <button class="book b7" data-vol="Vol.07" data-title="対話　他者　AI" data-copy="関係性の中で生まれる言葉と認識　対話によって見えてくる方向を観測する">
            <span class="vol">Vol.07</span><span class="title">対話　他者　AI</span><span class="sub">人　本　情報　関係性</span>
          </button>

          <button class="book b8" data-vol="Vol.08" data-title="価値　意味" data-copy="何を大切にするのか　価値　意味　信念　目的にピンを刺したときに見えるもの">
            <span class="vol">Vol.08</span><span class="title">価値　意味</span><span class="sub">信念　目的　生命の木</span>
          </button>

          <button class="book b9" data-vol="Vol.09" data-title="創造　表現" data-copy="言葉　作品　物語　観測されたものがどのように世界へ置かれていくのか">
            <span class="vol">Vol.09</span><span class="title">創造　表現</span><span class="sub">言葉　作品　物語</span>
          </button>

          <button class="book b10" data-vol="Vol.10" data-title="お金　物質" data-copy="価値の交換　所有　豊かさ　現実の条件　物質にピンを刺したときに立ち上がる景色">
            <span class="vol">Vol.10</span><span class="title">お金　物質</span><span class="sub">豊かさ　交換　現実</span>
          </button>
        </div>

        <div class="shelf-plank"></div>
      </div>
    </section>

    <section class="closing">
      <div class="label">Editorial note</div>
      <div>
        <blockquote>
          どこにピンを刺すかで<br>
          見える世界は変わる
        </blockquote>
        <footer>続きは　あなたの世界で　— Hermes</footer>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Hermes Editorial Room</span>
    <span>Observation / Translation / Creation</span>
  </footer>

  <dialog id="book-dialog">
    <div class="modal">
      <button class="close" type="button" aria-label="閉じる">×</button>
      <small id="modal-vol">From the shelf</small>
      <h3 id="modal-title"></h3>
      <p id="modal-copy"></p>
    </div>
  </dialog>

  <script>
    const dialog = document.getElementById("book-dialog")
    const modalVol = document.getElementById("modal-vol")
    const modalTitle = document.getElementById("modal-title")
    const modalCopy = document.getElementById("modal-copy")
    const closeButton = dialog.querySelector(".close")

    document.querySelectorAll("button.book").forEach((book) => {
      book.addEventListener("click", () => {
        modalVol.textContent = book.dataset.vol
        modalTitle.textContent = book.dataset.title
        modalCopy.textContent = book.dataset.copy
        dialog.showModal()
      })
    })

    closeButton.addEventListener("click", () => dialog.close())

    dialog.addEventListener("click", (event) => {
      const rect = dialog.getBoundingClientRect()
      const outside =
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom

      if (outside) dialog.close()
    })
  </script>
</body>
</html>
